<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#252923">
  <meta name="description" content="Mi Agenda: tareas, recordatorios y calendario.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>Mi Agenda</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">MI AGENDA</div>
      <h1 id="pageTitle">Hoy</h1>
    </div>
    <button class="icon-btn menu-btn" id="menuBtn" title="Opciones">⋮</button>
  </header>

  <main id="app" class="content"></main>

  <button class="fab" id="addBtn" aria-label="Añadir">＋</button>

  <nav class="bottom-nav">
    <button data-view="today" class="active"><span>🏠</span>Hoy</button>
    <button data-view="calendar"><span>📅</span>Calendario</button>
    <button data-view="tasks"><span>✅</span>Agenda</button>
  </nav>

  <dialog id="addDialog">
    <div class="dialog-card">
      <div class="dialog-head"><h2>Añadir</h2><button class="close" onclick="addDialog.close()">×</button></div>
      <div class="choice-grid">
        <button class="choice" onclick="openTaskForm()">✅<b>Nueva tarea</b><small>Algo que hacer</small></button>
      </div>
    </div>
  </dialog>

  <dialog id="menuDialog">
    <div class="dialog-card menu-card">
      <div class="dialog-head"><h2>Opciones</h2><button class="close" onclick="menuDialog.close()">×</button></div>
      <div class="menu-status">
        <span id="menuNotificationIcon">🔕</span>
        <div><b>Notificaciones</b><small id="menuNotificationText">Desactivadas</small></div>
      </div>
      <button class="menu-option" onclick="toggleNotificationsFromMenu()">🔔 <span>Activar / desactivar notificaciones</span></button>
      <button class="menu-option" onclick="exportBackup();menuDialog.close()">💾 <span>Guardar copia de seguridad</span></button>
      <button class="menu-option" onclick="document.getElementById('backupFile').click();menuDialog.close()">♻️ <span>Recuperar copia de seguridad</span></button>
      <button class="menu-option" onclick="checkForUpdates()">🔄 <span>Buscar actualizaciones</span></button>
    </div>
  </dialog>

  <dialog id="formDialog">
    <div class="dialog-card">
      <div class="dialog-head"><h2 id="formTitle">Nueva tarea</h2><button class="close" onclick="formDialog.close()">×</button></div>
      <form id="itemForm">
        <input type="hidden" id="itemType" value="task">
        <label>Título<input id="title" required maxlength="100" placeholder="¿Qué necesitas hacer?"></label>
        <div class="two">
          <label>Fecha<input id="date" type="date" required></label>
          <label id="timeWrap">Hora<input id="time" type="text" inputmode="numeric" readonly placeholder="Seleccionar hora" onclick="openTimePicker()"></label>
        </div>
        <label id="allDayWrap" class="check"><input id="allDay" type="checkbox"> Todo el día</label>
        <label id="endWrap">Hora de fin<input id="endTime" type="time"></label>
        <label id="repeatWrap">Repetir
          <select id="repeat">
            <option value="none">No repetir</option>
            <option value="daily">Cada día</option>
            <option value="weekly">Cada semana</option>
            <option value="monthly">Cada mes</option>
          </select>
        </label>
        <label class="check"><input id="reminder" type="checkbox"> Avisarme con una notificación</label>
        <label id="reminderTimeWrap">Avisarme con antelación
          <select id="reminderMinutes">
            <option value="5">5 minutos antes</option>
            <option value="10">10 minutos antes</option>
            <option value="15">15 minutos antes</option>
            <option value="30">30 minutos antes</option>
            <option value="60">1 hora antes</option>
            <option value="120" selected>2 horas antes</option>
            <option value="1440">1 día antes</option>
          </select>
        </label>
        <label>Prioridad
          <select id="priority">
            <option value="flexible">🟢 Flexible — puede pasar a otro día</option>
            <option value="normal" selected>⚪ Normal</option>
            <option value="priority">🟠 Prioritaria</option>
            <option value="urgent">🔴 Muy importante</option>
          </select>
        </label>
        <label>Notas<textarea id="notes" rows="3" placeholder="Opcional"></textarea></label>
        <button class="primary" type="submit">Guardar</button>
      </form>
    </div>
  </dialog>


  <dialog id="timePickerDialog">
    <div class="time-picker-card">
      <div class="time-picker-head"><h2>Seleccionar hora</h2><button class="close" onclick="timePickerDialog.close()">×</button></div>
      <div class="time-picker-value">
        <select id="pickerHour" aria-label="Hora"></select>
        <span>:</span>
        <select id="pickerMinute" aria-label="Minutos"></select>
      </div>
      <div class="time-picker-actions">
        <button type="button" class="time-cancel" onclick="timePickerDialog.close()">Cancelar</button>
        <button type="button" class="time-confirm" onclick="confirmTimePicker()">Establecer</button>
      </div>
    </div>
  </dialog>

  <script src="app.js?v=1.0.1"></script>
</body>
</html>
